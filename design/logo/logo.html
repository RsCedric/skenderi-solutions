<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1400px;font-family:Inter,"Segoe UI",sans-serif;background:#EEF1F6;padding:56px;color:#0B1B3A}
h1{font:600 14px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#5A6782;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{border-radius:24px;height:340px;display:flex;align-items:center;justify-content:center}
.light{background:#fff}.dark{background:#0B1B3A}.blue{background:#3D7BFF}
.lockup{display:flex;align-items:center;gap:26px}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font:700 58px "Space Grotesk","Segoe UI",sans-serif;letter-spacing:.02em}
.word span{font:500 19px "Space Grotesk","Segoe UI",sans-serif;letter-spacing:.62em;margin-top:10px;color:#3D7BFF}
.dark .word b{color:#fff}.dark .word span{color:#7FA7FF}
.small{display:flex;gap:24px;margin-top:24px}
.small .card{flex:1;height:240px}
.sw{display:flex;gap:16px;margin-top:24px}
.sw div{flex:1;border-radius:16px;height:110px;padding:18px;font:600 15px Inter,sans-serif;display:flex;flex-direction:column;justify-content:flex-end}
</style></head><body>
<h1>Skenderi Solutions · Logo-Entwurf</h1>
<div class="grid">
 <div class="card light"><div class="lockup">
  <svg width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0B1B3A"/><path d="M84 30 H50 a15 15 0 0 0 0 30 H70 a15 15 0 0 1 0 30 H36" fill="none" stroke="#fff" stroke-width="12"/><circle cx="86" cy="30" r="8" fill="#3D7BFF"/><circle cx="34" cy="90" r="8" fill="#3D7BFF"/></svg>
  <div class="word"><b>SKENDERI</b><span>SOLUTIONS</span></div></div></div>
 <div class="card dark"><div class="lockup">
  <svg width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#fff"/><path d="M84 30 H50 a15 15 0 0 0 0 30 H70 a15 15 0 0 1 0 30 H36" fill="none" stroke="#0B1B3A" stroke-width="12"/><circle cx="86" cy="30" r="8" fill="#3D7BFF"/><circle cx="34" cy="90" r="8" fill="#3D7BFF"/></svg>
  <div class="word"><b>SKENDERI</b><span>SOLUTIONS</span></div></div></div>
</div>
<div class="small">
 <div class="card light"><svg width="150" height="150" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0B1B3A"/><path d="M84 30 H50 a15 15 0 0 0 0 30 H70 a15 15 0 0 1 0 30 H36" fill="none" stroke="#fff" stroke-width="12"/><circle cx="86" cy="30" r="8" fill="#3D7BFF"/><circle cx="34" cy="90" r="8" fill="#3D7BFF"/></svg></div>
 <div class="card blue"><svg width="150" height="150" viewBox="0 0 120 120"><path d="M84 30 H50 a15 15 0 0 0 0 30 H70 a15 15 0 0 1 0 30 H36" fill="none" stroke="#fff" stroke-width="12"/><circle cx="86" cy="30" r="8" fill="#0B1B3A"/><circle cx="34" cy="90" r="8" fill="#0B1B3A"/></svg></div>
 <div class="card light" style="gap:28px">
  <svg width="64" height="64" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0B1B3A"/><path d="M84 30 H50 a15 15 0 0 0 0 30 H70 a15 15 0 0 1 0 30 H36" fill="none" stroke="#fff" stroke-width="12"/><circle cx="86" cy="30" r="8" fill="#3D7BFF"/><circle cx="34" cy="90" r="8" fill="#3D7BFF"/></svg>
  <svg width="32" height="32" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0B1B3A"/><path d="M84 30 H50 a15 15 0 0 0 0 30 H70 a15 15 0 0 1 0 30 H36" fill="none" stroke="#fff" stroke-width="14"/><circle cx="86" cy="30" r="9" fill="#3D7BFF"/><circle cx="34" cy="90" r="9" fill="#3D7BFF"/></svg>
  <svg width="16" height="16" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#0B1B3A"/><path d="M84 30 H50 a15 15 0 0 0 0 30 H70 a15 15 0 0 1 0 30 H36" fill="none" stroke="#fff" stroke-width="16"/></svg>
 </div>
</div>
<div class="sw">
 <div style="background:#0B1B3A;color:#fff">Midnight Navy<br>#0B1B3A</div>
 <div style="background:#3D7BFF;color:#fff">Signal Blue<br>#3D7BFF</div>
 <div style="background:#7FA7FF;color:#0B1B3A">Soft Blue<br>#7FA7FF</div>
 <div style="background:#fff;color:#0B1B3A">White<br>#FFFFFF</div>
</div>
</body></html>
